<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Classic Snake</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <h1>Snake</h1>
      <p class="subtitle">Use arrow keys or WASD. Press space to pause.</p>

      <section class="hud" aria-label="game status">
        <p>Score: <strong id="score">0</strong></p>
        <p>Status: <strong id="status">Ready</strong></p>
      </section>

      <div id="board" class="board" role="grid" aria-label="Snake board"></div>

      <section class="controls">
        <button data-action="up" aria-label="Move up">↑</button>
        <div class="row">
          <button data-action="left" aria-label="Move left">←</button>
          <button data-action="down" aria-label="Move down">↓</button>
          <button data-action="right" aria-label="Move right">→</button>
        </div>
        <div class="row actions">
          <button id="pause">Pause</button>
          <button id="restart">Restart</button>
        </div>
      </section>
    </main>

    <script type="module" src="snake.js"></script>
  </body>
</html>
